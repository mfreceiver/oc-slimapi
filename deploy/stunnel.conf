foreground = no
client = no

; 双入口都强制同一套 mTLS。替换证书路径和 accept 地址以匹配本机部署。
[opencode-direct]
accept = 127.0.0.1:14096
connect = 127.0.0.1:4096
cert = /etc/stunnel/server-cert.pem
key = /etc/stunnel/server-key.pem
CAfile = /etc/stunnel/ca-cert.pem
verifyChain = yes
TIMEOUTidle = 43200
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1
socket = l:SO_KEEPALIVE=1
socket = r:SO_KEEPALIVE=1

[opencode-thin]
accept = 127.0.0.1:14097
connect = 127.0.0.1:4097
cert = /etc/stunnel/server-cert.pem
key = /etc/stunnel/server-key.pem
CAfile = /etc/stunnel/ca-cert.pem
verifyChain = yes
TIMEOUTidle = 43200
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1
socket = l:SO_KEEPALIVE=1
socket = r:SO_KEEPALIVE=1
