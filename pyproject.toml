[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-slimapi"
version = "4.12.0"
description = "Loopback-only thin HTTP and curated SSE sidecar for opencode legacy APIs"
requires-python = ">=3.11.5"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  # starlette is imported directly (responses/types across 18 src modules);
  # lower bound mirrors the range FastAPI itself pulls in (fastapi 0.139.2
  # requires starlette>=0.46.0) — kept conservative, no extra upper cap.
  "starlette>=0.46",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
oc-slimapi = "oc_slimapi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
